// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath("com.android.tools.build:gradle:8.3.2")       // AGP version
    classpath("com.facebook.react:react-native-gradle-plugin") // React Native plugin (version comes from RN)
    classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.0") // Kotlin plugin
  }

}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
