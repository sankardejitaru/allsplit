name: iOS Build

on:
  push:
    branches:
      - ios_build
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: allsplit.money.app

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: allsplit.money.app/package-lock.json

      - name: Install JS dependencies
        run: npm ci

      - name: Generate / sync iOS native project
        run: npx expo prebuild --platform ios --non-interactive

      # RNMLKitTextRecognition / Google ML Kit require iOS 15.5+
      - name: Set iOS deployment target 15.5
        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = "ios/Podfile.properties.json";
          const props = fs.existsSync(path)
            ? JSON.parse(fs.readFileSync(path, "utf8"))
            : {};
          props["ios.deploymentTarget"] = "15.5";
          fs.writeFileSync(path, JSON.stringify(props, null, 2) + "\n");
          console.log("Updated", path, props);
          NODE

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Build iOS (Simulator Release)
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace ios/allsplitmoney.xcworkspace \
            -scheme allsplitmoney \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            build \
            CODE_SIGNING_ALLOWED=NO

      # When Apple signing is configured (cert + profile + exportOptions.plist teamID):
      # - name: Archive + export IPA
      #   run: |
      #     mkdir -p "$GITHUB_WORKSPACE/build"
      #     xcodebuild -workspace ios/allsplitmoney.xcworkspace \
      #       -scheme allsplitmoney -sdk iphoneos -configuration Release \
      #       -archivePath "$GITHUB_WORKSPACE/build/allsplitmoney.xcarchive" archive
      #     xcodebuild -exportArchive \
      #       -archivePath "$GITHUB_WORKSPACE/build/allsplitmoney.xcarchive" \
      #       -exportOptionsPlist ios/exportOptions.plist \
      #       -exportPath "$GITHUB_WORKSPACE/build"
