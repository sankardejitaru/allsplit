name: iOS Build

on:
  push:
    branches:
      - ios_build
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: ubuntu-latest   # EAS Build works fine on Ubuntu
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install JS dependencies
        run: npm install
        working-directory: allsplit.money.app

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Run EAS iOS Build
        run: eas build -p ios --non-interactive
        working-directory: allsplit.money.app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: allsplit.money.app/dist/*.ipa
