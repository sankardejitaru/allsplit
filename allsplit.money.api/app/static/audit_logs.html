<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AllSplit Audit Logs</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    rel="stylesheet"
  />
  <style>
    body {
      background: #f4f6f9;
    }

    .page-header {
      background: linear-gradient(135deg, #0f5132, #198754);
      color: #fff;
      border-radius: 0 0 1rem 1rem;
      margin-bottom: 1.5rem;
    }

    .stat-card {
      border: 0;
      box-shadow: 0 0.125rem 0.5rem rgba(0, 0, 0, 0.08);
    }

    .table-wrap {
      background: #fff;
      border-radius: 0.75rem;
      box-shadow: 0 0.125rem 0.5rem rgba(0, 0, 0, 0.08);
      overflow: hidden;
    }

    .badge-success-soft {
      background: #d1e7dd;
      color: #0f5132;
    }

    .badge-danger-soft {
      background: #f8d7da;
      color: #842029;
    }

    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.85rem;
    }

    .details-pre {
      max-height: 320px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .filter-card {
      border: 0;
      box-shadow: 0 0.125rem 0.5rem rgba(0, 0, 0, 0.08);
    }
  </style>
</head>
<body>
  <div class="page-header py-4 mb-4">
    <div class="container">
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-3">
        <div>
          <h1 class="h3 mb-1"><i class="bi bi-journal-text me-2"></i>Audit Logs</h1>
          <p class="mb-0 opacity-75">AllSplit API activity and business events</p>
        </div>
        <div class="d-flex gap-2">
          <button id="refreshBtn" class="btn btn-light btn-sm">
            <i class="bi bi-arrow-clockwise me-1"></i>Refresh
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="container pb-5">
    <div class="row g-3 mb-4">
      <div class="col-md-4">
        <div class="card stat-card">
          <div class="card-body">
            <div class="text-muted small">Total matching</div>
            <div id="totalCount" class="fs-3 fw-bold text-success">0</div>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card stat-card">
          <div class="card-body">
            <div class="text-muted small">Loaded rows</div>
            <div id="loadedCount" class="fs-3 fw-bold">0</div>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card stat-card">
          <div class="card-body">
            <div class="text-muted small">Last updated</div>
            <div id="lastUpdated" class="fs-6 fw-semibold">—</div>
          </div>
        </div>
      </div>
    </div>

    <div class="card filter-card mb-4">
      <div class="card-body">
        <form id="filterForm" class="row g-3 align-items-end">
          <div class="col-md-3">
            <label class="form-label" for="mobileFilter">Mobile</label>
            <input type="text" class="form-control" id="mobileFilter" placeholder="e.g. 919876543210" />
          </div>
          <div class="col-md-2">
            <label class="form-label" for="categoryFilter">Category</label>
            <select class="form-select" id="categoryFilter">
              <option value="">All</option>
              <option value="auth">Auth</option>
              <option value="split">Split</option>
              <option value="contact">Contact</option>
              <option value="profile">Profile</option>
              <option value="scan">Scan</option>
              <option value="http">HTTP</option>
            </select>
          </div>
          <div class="col-md-2">
            <label class="form-label" for="statusFilter">Status</label>
            <select class="form-select" id="statusFilter">
              <option value="">All</option>
              <option value="success">Success</option>
              <option value="failure">Failure</option>
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label" for="actionFilter">Action contains</label>
            <input type="text" class="form-control" id="actionFilter" placeholder="e.g. split.save" />
          </div>
          <div class="col-md-2">
            <label class="form-label" for="limitFilter">Page size</label>
            <select class="form-select" id="limitFilter">
              <option value="25">25</option>
              <option value="50" selected>50</option>
              <option value="100">100</option>
            </select>
          </div>
          <div class="col-12 d-flex gap-2">
            <button type="submit" class="btn btn-success">
              <i class="bi bi-funnel me-1"></i>Apply filters
            </button>
            <button type="button" id="resetBtn" class="btn btn-outline-secondary">Reset</button>
          </div>
        </form>
      </div>
    </div>

    <div id="alertBox" class="alert alert-danger d-none" role="alert"></div>

    <div class="table-wrap">
      <div class="table-responsive">
        <table class="table table-hover mb-0 align-middle">
          <thead class="table-light">
            <tr>
              <th>Time</th>
              <th>Action</th>
              <th>Category</th>
              <th>Status</th>
              <th>Actor</th>
              <th>Message</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="logsBody">
            <tr>
              <td colspan="7" class="text-center text-muted py-5">Loading audit logs...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="d-flex justify-content-between align-items-center mt-3">
      <button id="loadMoreBtn" class="btn btn-outline-success d-none">
        <i class="bi bi-chevron-down me-1"></i>Load more
      </button>
      <span id="paginationHint" class="text-muted small"></span>
    </div>
  </div>

  <div class="modal fade" id="detailsModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Audit log details</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <dl class="row mb-0" id="detailsList"></dl>
          <hr />
          <h6>Details JSON</h6>
          <pre id="detailsJson" class="details-pre mono bg-light p-3 rounded border"></pre>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const state = {
      logs: [],
      total: 0,
      skip: 0,
      loading: false,
    };

    const logsBody = document.getElementById("logsBody");
    const alertBox = document.getElementById("alertBox");
    const totalCount = document.getElementById("totalCount");
    const loadedCount = document.getElementById("loadedCount");
    const lastUpdated = document.getElementById("lastUpdated");
    const loadMoreBtn = document.getElementById("loadMoreBtn");
    const paginationHint = document.getElementById("paginationHint");
    const detailsModal = new bootstrap.Modal(document.getElementById("detailsModal"));

    function showError(message) {
      alertBox.textContent = message;
      alertBox.classList.remove("d-none");
    }

    function hideError() {
      alertBox.classList.add("d-none");
      alertBox.textContent = "";
    }

    function formatTime(value) {
      if (!value) return "—";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return String(value);
      return date.toLocaleString();
    }

    function statusBadge(status) {
      const cls = status === "success" ? "badge-success-soft" : "badge-danger-soft";
      return `<span class="badge ${cls} text-uppercase">${status || "unknown"}</span>`;
    }

    function buildPayload() {
      const mobile = document.getElementById("mobileFilter").value.trim();
      const category = document.getElementById("categoryFilter").value;
      const status = document.getElementById("statusFilter").value;
      const action = document.getElementById("actionFilter").value.trim();
      const limit = Number(document.getElementById("limitFilter").value || 50);

      return {
        mobile: mobile || null,
        category: category || null,
        status: status || null,
        action: action || null,
        limit,
        skip: state.skip,
      };
    }

    async function fetchLogs(reset) {
      if (state.loading) return;
      state.loading = true;
      hideError();

      if (reset) {
        state.skip = 0;
        state.logs = [];
      }

      try {
        const response = await fetch("/audit-logs/list", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(buildPayload()),
        });

        const data = await response.json();
        if (!response.ok || data.success === false) {
          throw new Error(data.message || data.detail || `HTTP ${response.status}`);
        }

        const rows = data.logs || [];
        state.total = data.total ?? rows.length;
        state.logs = reset ? rows : state.logs.concat(rows);
        state.skip = state.logs.length;

        renderTable();
        updateSummary();
      } catch (error) {
        showError(error.message || "Failed to load audit logs");
        if (reset) {
          logsBody.innerHTML =
            '<tr><td colspan="7" class="text-center text-danger py-5">Could not load audit logs.</td></tr>';
        }
      } finally {
        state.loading = false;
      }
    }

    function renderTable() {
      if (!state.logs.length) {
        logsBody.innerHTML =
          '<tr><td colspan="7" class="text-center text-muted py-5">No audit logs found for the selected filters.</td></tr>';
        loadMoreBtn.classList.add("d-none");
        return;
      }

      logsBody.innerHTML = state.logs
        .map(
          (log, index) => `
          <tr>
            <td class="small text-nowrap">${formatTime(log.timestamp)}</td>
            <td class="mono">${escapeHtml(log.action || "—")}</td>
            <td><span class="badge text-bg-secondary">${escapeHtml(log.category || "—")}</span></td>
            <td>${statusBadge(log.status)}</td>
            <td class="small">${escapeHtml(log.actor_mobile || log.device_id || "—")}</td>
            <td class="small">${escapeHtml(log.message || "—")}</td>
            <td>
              <button class="btn btn-sm btn-outline-primary" data-index="${index}">
                <i class="bi bi-eye"></i>
              </button>
            </td>
          </tr>`
        )
        .join("");

      logsBody.querySelectorAll("button[data-index]").forEach((button) => {
        button.addEventListener("click", () => {
          openDetails(state.logs[Number(button.dataset.index)]);
        });
      });

      const hasMore = state.logs.length < state.total;
      loadMoreBtn.classList.toggle("d-none", !hasMore);
      paginationHint.textContent = hasMore
        ? `Showing ${state.logs.length} of ${state.total}`
        : `Showing all ${state.logs.length} records`;
    }

    function updateSummary() {
      totalCount.textContent = String(state.total);
      loadedCount.textContent = String(state.logs.length);
      lastUpdated.textContent = new Date().toLocaleString();
    }

    function openDetails(log) {
      const fields = [
        ["ID", log.id],
        ["Timestamp", formatTime(log.timestamp)],
        ["Action", log.action],
        ["Category", log.category],
        ["Status", log.status],
        ["Message", log.message],
        ["Method", log.method],
        ["Path", log.path],
        ["Actor mobile", log.actor_mobile],
        ["Device ID", log.device_id],
        ["Resource type", log.resource_type],
        ["Resource ID", log.resource_id],
        ["HTTP status", log.status_code],
        ["Duration (ms)", log.duration_ms],
      ];

      document.getElementById("detailsList").innerHTML = fields
        .filter(([, value]) => value !== null && value !== undefined && value !== "")
        .map(
          ([label, value]) => `
          <dt class="col-sm-3">${escapeHtml(label)}</dt>
          <dd class="col-sm-9 mono">${escapeHtml(String(value))}</dd>`
        )
        .join("");

      document.getElementById("detailsJson").textContent = JSON.stringify(
        log.details || {},
        null,
        2
      );
      detailsModal.show();
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    document.getElementById("filterForm").addEventListener("submit", (event) => {
      event.preventDefault();
      fetchLogs(true);
    });

    document.getElementById("resetBtn").addEventListener("click", () => {
      document.getElementById("mobileFilter").value = "";
      document.getElementById("categoryFilter").value = "";
      document.getElementById("statusFilter").value = "";
      document.getElementById("actionFilter").value = "";
      document.getElementById("limitFilter").value = "50";
      fetchLogs(true);
    });

    document.getElementById("refreshBtn").addEventListener("click", () => fetchLogs(true));
    document.getElementById("loadMoreBtn").addEventListener("click", () => fetchLogs(false));

    fetchLogs(true);
  </script>
</body>
</html>
